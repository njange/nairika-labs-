# HTTP only to start with. Once DNS resolves, run:
#   certbot --nginx -d nairika.co.ke -d www.nairika.co.ke
# and certbot adds the HTTPS server block and redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name nairika.co.ke www.nairika.co.ke;

    location / {
        proxy_pass http://127.0.0.1:5190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
